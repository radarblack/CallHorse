name: Build CallHorse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $path) { throw "MSBuild.exe not found" }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Build Release x64
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" CallHorse.sln /m /nologo /verbosity:minimal /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage files
        shell: pwsh
        run: |
          $dll = "build\x64\Release\CallHorse.dll"
          if (-not (Test-Path $dll)) { throw "$dll was not produced" }
          New-Item -ItemType Directory -Force -Path dist\plugins, dist\lua | Out-Null
          Copy-Item $dll dist\plugins\
          Copy-Item lua\WhistleHorse.lua dist\lua\
          Copy-Item LICENSE dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallHorse
          path: dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: CallHorse
          path: dist

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $zip = "CallHorse-$env:TAG.zip"
          Compress-Archive -Path dist\* -DestinationPath $zip
          gh release create $env:TAG $zip --repo $env:REPO --generate-notes

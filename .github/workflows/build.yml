name: Build CallHorse

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $path) { throw "MSBuild.exe not found" }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Build Release x64
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" CallHorse.sln /m /nologo /verbosity:minimal /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create zip
        shell: pwsh
        run: |
          $dll = "build\x64\Release\CallHorse.dll"
          if (-not (Test-Path $dll)) { throw "$dll was not produced" }
          New-Item -ItemType Directory -Force -Path dist\plugins, dist\lua | Out-Null
          Copy-Item $dll dist\plugins\
          Copy-Item lua\WhistleHorse.lua dist\lua\
          Copy-Item LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath CallHorse.zip -Force
          if (-not (Test-Path CallHorse.zip)) { throw "CallHorse.zip was not created" }

      - name: Upload zip
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: CallHorse.zip
          archive: false
          if-no-files-found: error

      - name: Add download link to summary
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          "Download: [CallHorse.zip]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create $env:TAG CallHorse.zip --repo $env:REPO --generate-notes

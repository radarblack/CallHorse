name: Build HookSample DLL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HOOKSAMPLE_REPO: Yazed0071/MGSV_HookSample
  HOOKSAMPLE_REF: 82c6b95681c054d11a8882f0d1b596ee72d53dca

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout HookSample base
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOOKSAMPLE_REPO }}
          ref: ${{ env.HOOKSAMPLE_REF }}
          path: base

      - name: Apply buddy whistle changes
        shell: pwsh
        run: |
          $map = @(
            @{ From = "overlay\Buddywhistle.cpp";    To = "base\src\BuddyWhistle.cpp" },
            @{ From = "overlay\Buddwhistle.h";       To = "base\src\BuddyWhistle.h" },
            @{ From = "overlay\Setluafunctions.cpp"; To = "base\src\SetLuaFunctions.cpp" },
            @{ From = "overlay\Hooksample.vcxproj";  To = "base\HookSample.vcxproj" }
          )
          foreach ($item in $map) {
            if (-not (Test-Path $item.From)) { throw "Missing file in this repo: $($item.From)" }
            Copy-Item $item.From $item.To -Force
          }

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $path) { throw "MSBuild.exe not found" }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Build Release x64
        shell: pwsh
        working-directory: base
        run: |
          & "${{ steps.msbuild.outputs.path }}" HookSample.sln /m /nologo /verbosity:minimal /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage files
        shell: pwsh
        run: |
          $dll = "base\x64\Release\HookSample.dll"
          if (-not (Test-Path $dll)) { throw "$dll was not produced" }
          New-Item -ItemType Directory -Force -Path dist\lua | Out-Null
          Copy-Item $dll dist\
          Copy-Item base\lua\*.lua dist\lua\
          Copy-Item overlay\luacompanion\*.lua dist\lua\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HookSample-x64-Release
          path: dist
          if-no-files-found: error
